instructions: |
  Use et1-action as the only ET1 robot action skill. The model is bash-only: call scripts/et1-action for text-to-motion, .trk execution, status, standby, explicit fixstand, urgent stop, idle loading, idle clearing, cache clearing, and action sequences. Do not rely on typed tools, plugins, curl, or multi-tool parallel calls. Treat ordinary stop, pause, resume, relax, 停下, and 停止动作 requests as standby; use idle-clear for 不要动, 站着别动, do not move, completely still, no idle, and 别播放 idle requests. Use fixstand only for explicit stand configuration requests; use urgent-stop --urgent only for explicit emergency/abort/kill/urgent quick-stop requests. For generated motion, send concise English Kimodo-style prompts with short physical durations; use --seed for reproducible/retry variants and per-segment duration/seed/diffusion_steps in sequence-start when helpful. Add --hold for final-pose requests and --no-preset for precise left/right limb actions. Clear cache only on explicit user request with cache-clear. For multi-part action, call sequence-start once and respond immediately; do not block with sleep+sequence-status unless the user explicitly asks for progress.
