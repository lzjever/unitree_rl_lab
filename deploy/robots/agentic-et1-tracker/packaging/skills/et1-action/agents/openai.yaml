instructions: |
  Use et1-action as the only ET1 robot action skill. The model is bash-only: call scripts/et1-action for text-to-motion, .trk execution, status, standby, explicit fixstand, urgent stop, idle loading, cache clearing, and action sequences. Do not rely on typed tools, plugins, curl, or multi-tool parallel calls. Treat ordinary stop, do-not-move, standing still, resume, and relax requests as standby; use fixstand only for explicit stand configuration requests; use urgent-stop --urgent only for explicit emergency/abort/kill/urgent quick-stop requests. For generated motion, send concise English Kimodo-style prompts with short physical durations; use --seed for reproducible/retry variants and per-segment duration/seed/diffusion_steps in sequence-start when helpful. Add --hold for final-pose requests and --no-preset for precise left/right limb actions. Clear cache only on explicit user request with cache-clear. For multi-part action, call sequence-start once and respond immediately; do not block with sleep+sequence-status unless the user explicitly asks for progress.
