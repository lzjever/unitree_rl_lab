interface:
  display_name: "ET1 TRK to Motion"
  short_description: "Execute ET1 .trk files through the local agentic tracker."
  default_prompt: "Use scripts/et1-trk2motion first for normal work: state, ready, run PATH --wait, repeat PATH -n N, idle set PATH..., idle clear, standby. To load idle presets/放松点/别直挺挺站着, find cwd preset-trk/idle/*.trk, copy to tracker-readable generated/motion_dirs, then idle set copied paths; this is not stop/fixstand/clear. run/exec/repeat default to queue; use --mode interrupt only when explicitly requested. Never infer stop; use stop --urgent only for direct urgent stop/abort/kill/紧急停止/赶快停止 requests; normal stop => standby preserving idle config. Use standby for normal stop/relax/recover/静止站立/不要动/站着别动; clear idle only when explicit. fixstand only for explicit enter stand configuration/control prep (进入站立构型 or named recovery/prep); not normal standing. ready is read-only; run/repeat go directly to /execute and must not auto-recover from passive or fixstand. After passive, only run explicit user-requested fixstand, then explicit separately requested standby. passive requires ET1_PASSIVE_PASSWORD or --password; never save or print it. Prefer compact one-line JSON and avoid curl. Check active.kind, exec, queue, and transition.target; only active.kind=user has a waitable id, idle/background can be preempted by user run, and transition.target=user makes queued user work wait. For fallback, read references/raw-http.md and use raw METHOD PATH [JSON]."
