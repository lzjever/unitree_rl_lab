             0.0, 0.0,
             0.0, 0.2, 0.0, 1.5, 0.0,
             0.0, -0.2, 0.0, 1.5, 0.0,
             0.0, 0.0]

    joint_ids: null
policy_kp: [80, 80, 80, 80, 40, 40,
            80, 80, 80, 80, 40, 40,
            80, 80,
            60, 60, 40, 40, 40,
            60, 60, 40, 40, 40,
            40, 10]
policy_kd: [5, 5, 5, 5, 3, 3,
            5, 5, 5, 5, 3, 3,
            5, 5,
            4, 4, 3, 3, 3,
            4, 4, 3, 3, 3,
            3, 0.1]
torque_limit: [60.0, 60.0, 60.0, 60.0, 50.0, 50.0,
