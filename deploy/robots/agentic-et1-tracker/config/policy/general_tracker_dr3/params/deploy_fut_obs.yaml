    clip: null
    joint_names: [.*]
    # scale = 0.25 * effort_limit / stiffness
    scale: [0.1875, 0.1875, 0.1875, 0.1875, 0.3125, 0.3125,
            0.1875, 0.1875, 0.1875, 0.1875, 0.3125, 0.3125,
            0.1875, 0.1875,
            0.25, 0.25, 0.20625, 0.20625, 0.20625,
            0.25, 0.25, 0.20625, 0.20625, 0.20625,
            0.20625, 0.0775]
    offset: [-0.2, 0.13, 0.0, 0.33, -0.15, -0.12,
