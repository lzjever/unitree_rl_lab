agentic_et1_tracker:
  bind: "127.0.0.1"
  port: 8080
  network: "lo"
  domain_id: 0
  mode_machine: 1
  motion_dirs:
    - "/home/galbot/motions"
  queue_limit: 8
  recent_limit: 32
  max_track_duration_s: 120
  stop_hold_s: 0.0
  idle_mode: "hold_current"
  policy:
    profile: "GeneralTracker"
    policy_dir: "config/policy/general_tracker"
    policy_file: "self_collision_footmesh_15k.onnx"
    deploy: "config/policy/general_tracker/params/deploy.yaml"
    fps: 50
  control:
    startup_control: "FixStand"
    velocity_policy_dir: "config/policy/velocity/v0"
    velocity_policy_file: "policy.onnx"
    velocity_deploy: "config/policy/velocity/v0/params/deploy.yaml"
    fixstand_config: "config/posture/fixstand/v0/fixstand.yaml"
    passive_config: "config/posture/passive/v0/passive.yaml"
